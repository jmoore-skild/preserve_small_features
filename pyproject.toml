[project]
name = "topo-rebuild-eval"
version = "0.1.0"
description = "Exclude-and-rebuild topology optimization: cantilever evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy", "scipy", "pyyaml", "matplotlib", "requests",
    "trimesh", "manifold3d", "rtree", "tetgen", "pyvista",
    "ansys-mechanical-core", "ansys-mapdl-core",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning:trimesh.*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]
