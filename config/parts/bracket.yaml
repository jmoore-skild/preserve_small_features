# Test L-bracket (featurescript/TestBracket.fs), marked with Preserve region in the GUI.
# Draft for Gate 3: the BCs assume the base holes are FIX and the upright holes (and pad) are LOAD.
onshape:
  element_id: 71998051ac301addb3814c18     # Part Studio "Bracket"

supports:
  - type: fixed
    regions: all
loads:
  - type: remote_force
    regions: all
    magnitude: 150.0      # N, placeholder
    direction: [1, 0, 0]  # pulls the upright away from the base: bends the inner corner
    behavior: deformable
